<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PCA Region VII Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    .header {
      background: #1f6f43;
      color: white;
      padding: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    #reader {
      width: 500px;
      max-width: 90%;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    #status {
      margin: 20px auto;
      padding: 15px;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      font-weight: bold;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    #result {
  display: none;
  position: fixed;
  top: 25px;
  right: 25px;
  width: 300px;
  padding: 20px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
  text-align: center;
  z-index: 9999;
}

.last-scan-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.employee-photo {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
  margin-bottom: 12px;
}

.employee-name {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 5px;
}

#employeeId {
  font-size: 14px;
  margin-bottom: 8px;
}

#employeePosition,
#employeeOffice {
  font-size: 14px;
  margin-bottom: 4px;
}

.action {
  font-size: 18px;
  font-weight: bold;
  margin-top: 12px;
}

#attendanceStatus {
  font-weight: bold;
  margin-top: 5px;
}

#attendanceTime {
  font-size: 16px;
  margin-top: 8px;
}

#attendanceDate {
  font-size: 14px;
  margin-top: 3px;
}

    .employee-name {
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }

    .action {
      font-size: 25px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>PCA REGION VII</h1>
    <p>ATTENDANCE SYSTEM</p>
  </div>

  <div class="container">

    <h2>📷 QR ATTENDANCE SCANNER</h2>

    <p>
      Please allow camera access when your browser asks.
    </p>

    <div id="reader"></div>

    <div id="status">
      Starting camera...
    </div>

   <div id="result">

  <div class="last-scan-title">LAST SCAN</div>

  <img id="employeePhoto" class="employee-photo" src="" alt="Employee Photo">

  <div id="employeeName" class="employee-name"></div>

  <div id="employeeId"></div>

  <div id="employeePosition"></div>

  <div id="employeeOffice"></div>

  <div id="attendanceAction" class="action"></div>

  <div id="attendanceStatus"></div>

  <div id="attendanceTime"></div>

  <div id="attendanceDate"></div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz8sNUktt5e83OX14I58uuq2WNKtd6cGwLkl90aPazmyWwbwFzW95cthYutEEhy5MC5/exec";

let scanner = null;
let processing = false;
let lastScannedId = "";
let lastScanTime = 0;

const SCAN_COOLDOWN = 3000;


function setStatus(message, type = "") {

  const status =
    document.getElementById("status");

  status.innerText = message;
  status.className = type;

}


function startCamera() {

  if (scanner) {
    return;
  }

  setStatus("Starting camera...");

  Html5Qrcode.getCameras()

    .then(function(devices) {

      if (!devices || devices.length === 0) {

        setStatus(
          "ERROR: No camera found.",
          "error"
        );

        return;
      }


      const cameraId = devices[0].id;

      scanner =
        new Html5Qrcode("reader");


      scanner.start(

        cameraId,

        {
          fps: 30,

          qrbox: {
            width: 400,
            height: 400
          },

          aspectRatio: 1.0,

          disableFlip: false
        },


        function(decodedText) {

          handleQRCode(decodedText);

        },


        function(errorMessage) {

          // Normal scanning errors are ignored.

        }

      )

      .then(function() {

        setStatus(
          "✓ CAMERA READY — PRESENT YOUR QR CODE"
        );

      })

      .catch(function(error) {

        console.error(
          "Camera start error:",
          error
        );

        scanner = null;

        setStatus(
          "CAMERA ERROR: " + error,
          "error"
        );

      });

    })

    .catch(function(error) {

      console.error(
        "Camera access error:",
        error
      );

      setStatus(
        "CAMERA ACCESS ERROR: " + error,
        "error"
      );

    });

}


function handleQRCode(decodedText) {

  const employeeId =
    decodedText.trim();


  if (!employeeId) {
    return;
  }


  const now =
    Date.now();


  // Prevent the same QR from being
  // processed repeatedly.

  if (
    processing ||
    (
      employeeId === lastScannedId &&
      now - lastScanTime < SCAN_COOLDOWN
    )
  ) {

    return;

  }


  processing = true;

  lastScannedId = employeeId;

  lastScanTime = now;


  console.log(
    "QR DETECTED:",
    employeeId
  );


  setStatus(
    "✓ QR DETECTED — RECORDING..."
  );


  sendAttendance(employeeId);

}


function sendAttendance(employeeId) {

  const url =
    APPS_SCRIPT_URL +
    "?action=attendance&id=" +
    encodeURIComponent(employeeId);


  fetch(url)

    .then(function(response) {

      return response.json();

    })

    .then(function(data) {

      displayResult(data);

    })

    .catch(function(error) {

      console.error(
        "Attendance error:",
        error
      );

      setStatus(
        "CONNECTION ERROR: " + error,
        "error"
      );

      processing = false;

    });

}


function displayResult(data) {

  const result =
    document.getElementById("result");


  result.style.display = "block";


  if (!data.success) {

    setStatus(
      "✗ " + data.message,
      "error"
    );

    processing = false;

    setTimeout(function() {

      result.style.display = "none";

      setStatus(
        "✓ CAMERA READY — PRESENT YOUR QR CODE"
      );

    }, 2500);

    return;

  }


  setStatus(
    "✓ ATTENDANCE RECORDED",
    "success"
  );


  // ==============================
  // EMPLOYEE INFORMATION
  // ==============================

document.getElementById(
  "employeePhoto"
).src =
  data.employee.photo || "";

console.log("PHOTO URL:", data.employee.photo);

  document.getElementById(
    "employeeName"
  ).innerText =
    data.employee.name;


  document.getElementById(
    "employeeId"
  ).innerText =
    data.employee.id;


  document.getElementById(
    "employeePosition"
  ).innerText =
    data.employee.position;


  document.getElementById(
    "employeeOffice"
  ).innerText =
    data.employee.office;


  // ==============================
  // ATTENDANCE INFORMATION
  // ==============================

  document.getElementById(
    "attendanceAction"
  ).innerText =
    data.action;


  document.getElementById(
    "attendanceStatus"
  ).innerText =
    data.status;


  document.getElementById(
    "attendanceTime"
  ).innerText =
    data.time;


  document.getElementById(
    "attendanceDate"
  ).innerText =
    data.date;


  // ==============================
  // RESET AFTER 2.5 SECONDS
  // ==============================

  setTimeout(function() {

    result.style.display = "none";

    processing = false;

    setStatus(
      "✓ CAMERA READY — PRESENT YOUR QR CODE"
    );

  }, 2500);

}


startCamera();

</script>

</body>
</html>
