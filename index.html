<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PCA Region VII Attendance</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f5;
      color: #222;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #1f6f43;
      color: white;
      padding: 18px 30px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 30px;
      align-items: start;
    }

    /* =========================
       SCANNER
    ========================= */

    .scanner-card {
      background: white;
      border: 1px solid #dfe7e1;
      border-radius: 12px;
      padding: 25px;
    }

    .scanner-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #1f6f43;
    }

    .scanner-card p {
      margin: 0 0 20px;
      color: #666;
      font-size: 14px;
    }

    #reader {
      width: 360px;
      max-width: 100%;
      margin: 0 auto;
    }

    /* =========================
       LAST SCAN
    ========================= */

    .last-scan {
      background: white;
      border: 1px solid #dfe7e1;
      border-radius: 12px;
      padding: 22px;
      min-height: 400px;
    }

    .last-scan h2 {
      margin: 0 0 20px;
      color: #1f6f43;
      font-size: 20px;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 12px;
    }

    .employee-photo {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin: 0 auto 18px;
      border: 1px solid #d8dfda;
      background: #f0f3f1;
    }

    .employee-name {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .employee-id {
      text-align: center;
      color: #1f6f43;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .employee-info {
      font-size: 14px;
      line-height: 1.7;
    }

    .employee-info div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eeeeee;
      padding: 6px 0;
      gap: 15px;
    }

    .label {
      color: #777;
    }

    .value {
      text-align: right;
      font-weight: 500;
    }

    /* =========================
       ATTENDANCE RESULT
    ========================= */

    .attendance-result {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #e5e5e5;
      text-align: center;
    }

    .action {
      font-size: 18px;
      font-weight: bold;
      color: #1f6f43;
      margin-bottom: 7px;
    }

    .status {
      font-size: 14px;
      font-weight: bold;
    }

    .message {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty {
      text-align: center;
      color: #999;
      padding: 70px 10px;
      font-size: 14px;
    }

    /* =========================
       SUCCESS / ERROR
    ========================= */

    .success {
      color: #1f6f43;
    }

    .error {
      color: #c0392b;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .main {
        grid-template-columns: 1fr;
        max-width: 600px;
      }

      .last-scan {
        min-height: auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>PCA Region VII Attendance System</h1>
    <p>Assessment Monitoring Service</p>
  </header>


  <div class="main">

    <!-- =========================
         SCANNER
    ========================= -->

    <div class="scanner-card">

      <h2>QR Attendance Scanner</h2>

      <p>
        Scan the employee QR code to record attendance.
      </p>

      <div id="reader"></div>

    </div>


    <!-- =========================
         LAST SCAN
    ========================= -->

    <div class="last-scan">

      <h2>Last Scan</h2>

      <div id="emptyState" class="empty">
        No attendance scan yet.
      </div>

      <div id="employeeInfo" style="display:none;">

        <img
          id="employeePhoto"
          class="employee-photo"
          src=""
          alt="Employee Photo"
        >

        <div id="employeeName" class="employee-name"></div>

        <div id="employeeId" class="employee-id"></div>

        <div class="employee-info">

          <div>
            <span class="label">Position</span>
            <span id="employeePosition" class="value"></span>
          </div>

          <div>
            <span class="label">Office</span>
            <span id="employeeOffice" class="value"></span>
          </div>

        </div>


        <div class="attendance-result">

          <div id="attendanceAction" class="action"></div>

          <div id="attendanceStatus" class="status"></div>

          <div id="attendanceMessage" class="message"></div>

        </div>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       GOOGLE APPS SCRIPT
    ========================= */

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbz8sNUktt5e83OX14I58uuq2WNKtd6cGwLkl90aPazmyWwbwFzW95cthYutEEhy5MC5/exec";


    /* =========================
       SHOW RESULT
    ========================= */

    function displayResult(data) {

      const emptyState =
        document.getElementById("emptyState");

      const employeeInfo =
        document.getElementById("employeeInfo");

      const employeePhoto =
        document.getElementById("employeePhoto");

      const employeeName =
        document.getElementById("employeeName");

      const employeeId =
        document.getElementById("employeeId");

      const employeePosition =
        document.getElementById("employeePosition");

      const employeeOffice =
        document.getElementById("employeeOffice");

      const attendanceAction =
        document.getElementById("attendanceAction");

      const attendanceStatus =
        document.getElementById("attendanceStatus");

      const attendanceMessage =
        document.getElementById("attendanceMessage");


      /* =========================
         NO EMPLOYEE INFORMATION
      ========================= */

      if (!data.employee) {

        emptyState.style.display = "block";
        employeeInfo.style.display = "none";

        emptyState.innerHTML =
          data.message || "Scan rejected.";

        return;
      }


      /* =========================
         SHOW EMPLOYEE
      ========================= */

      emptyState.style.display = "none";
      employeeInfo.style.display = "block";


      employeeName.textContent =
        data.employee.name || "Unknown Employee";

      employeeId.textContent =
        data.employee.id || "";

      employeePosition.textContent =
        data.employee.position || "N/A";

      employeeOffice.textContent =
        data.employee.office || "N/A";


      /* =========================
         EMPLOYEE PHOTO
      ========================= */

      employeePhoto.src =
        "https://gekijouron.github.io/pca-region-vii-attendance-scanner/" +
        data.employee.id +
        ".jpg";


      employeePhoto.onerror = function() {

        this.src =
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="200"
                 height="200"
                 viewBox="0 0 200 200">

              <rect width="200" height="200" fill="#f0f3f1"/>

              <text x="100"
                    y="105"
                    text-anchor="middle"
                    font-family="Arial"
                    font-size="16"
                    fill="#777">
                No Photo
              </text>

            </svg>
          `);

      };


      /* =========================
         ATTENDANCE RESULT
      ========================= */

      if (data.success) {

        attendanceAction.textContent =
          data.action || "ATTENDANCE RECORDED";

        attendanceAction.className =
          "action success";

        attendanceStatus.textContent =
          data.status || "";

        attendanceStatus.className =
          "status success";

        attendanceMessage.textContent =
          (data.date || "") +
          " • " +
          (data.time || "");

      } else {

        attendanceAction.textContent =
          "SCAN REJECTED";

        attendanceAction.className =
          "action error";

        attendanceStatus.textContent =
          "NOT RECORDED";

        attendanceStatus.className =
          "status error";

        attendanceMessage.textContent =
          data.message || "Attendance was not recorded.";

      }

    }


    /* =========================
       PROCESS QR CODE
    ========================= */

    async function onScanSuccess(decodedText) {

      console.log("QR CODE:", decodedText);

      try {

        const url =
          SCRIPT_URL +
          "?action=attendance&id=" +
          encodeURIComponent(decodedText.trim());


        const response =
          await fetch(url);


        const data =
          await response.json();


        console.log("SERVER RESPONSE:", data);


        displayResult(data);

      }

      catch (error) {

        console.error(error);

        document.getElementById("emptyState").style.display =
          "block";

        document.getElementById("employeeInfo").style.display =
          "none";

        document.getElementById("emptyState").textContent =
          "Unable to connect to attendance system.";

      }

    }


    /* =========================
       QR SCANNER
    ========================= */

    function onScanFailure(error) {
      // Ignore normal scanning errors.
    }


    const scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 15,

          qrbox: {
            width: 280,
            height: 280
          },

          aspectRatio: 1.0,

          rememberLastUsedCamera: true,

          showTorchButtonIfSupported: true
        },
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>
</html>
